[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "udos-reasoning-engine"
version = "7.5.0"
description = "UDOS unified world-model engine v7 (single residual recurrent predictor + calibrated uncertainty); legacy udos/ 5.5.5 frozen"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "huggingface_hub>=0.20"]

[project.scripts]
udos = "udos7.cli:main"

[tool.setuptools.packages.find]
include = ["udos*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests7"]
addopts = "-q"
markers = [
    "slow: 训练类较慢用例",
    "upstream: 加载第三方上游库的用例",
]
