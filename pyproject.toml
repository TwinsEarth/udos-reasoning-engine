[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "udos-reasoning-engine"
version = "5.4.3"
description = "UDOS dual-engine reasoning core: CTM (SakanaAI continuous-thought-machines) + GPM (SakanaAI doc-to-lora)"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "huggingface_hub>=0.20"]

[tool.setuptools.packages.find]
include = ["udos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 训练类较慢用例",
    "upstream: 加载第三方上游库的用例",
]
