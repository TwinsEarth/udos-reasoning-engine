services:
  udos-engine:
    build: .
    image: udos-reasoning-engine:5.5.5
    container_name: udos-engine
    ports:
      - "8000:8000"
    command: ["python", "-m", "udos.server",
              "--host", "0.0.0.0", "--port", "8000", "--preset", "small",
              "--checkpoint", "checkpoints/predictor_v4.3.9.pt"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M   # v2 /train 训练时需要额外内存
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status']=='ok'"]
      interval: 15s
      timeout: 5s
      retries: 3
